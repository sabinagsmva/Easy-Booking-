<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Guest – EasyBooking</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    .admin-shell { max-width: 720px; margin: 32px auto; padding: 0 16px; }
    .card {
      background: #fff; border-radius: 14px; padding: 24px 22px;
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
    }
    .card h2 { margin: 0 0 18px; color: #193e65; }
    .form-grid {
      display: grid; gap: 14px;
      grid-template-columns: 1fr 1fr;
    }
    .form-grid .full { grid-column: 1 / -1; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%; padding: 14px 12px; font-size: 16px; line-height: 1.2;
      border: 1px solid #d7dbe0; border-radius: 10px; outline: none;
    }
    input:focus { border-color: #5f80ff; box-shadow: 0 0 0 3px rgba(95,128,255,.15); }
    .actions { display: flex; gap: 12px; margin-top: 16px; }
    .btn {
      appearance: none; border: 0; cursor: pointer; padding: 12px 18px;
      border-radius: 10px; font-weight: 700; font-size: 16px;
    }
    .btn-primary { background: #193e65; color: #fff; }
    .btn-secondary { background: #eef2f7; color: #193e65; text-decoration: none; display: inline-flex; align-items: center; }
    @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Add New Guest</h1>
    <nav><a href="../maintenance.html">Maintenance</a></nav>
  </header>

  <main class="admin-shell">
    <section class="card">
      <h2>Guest Information</h2>

      <form action="../feedback.html" method="get" novalidate>
        <div class="form-grid">
          <div class="full">
            <label for="fullname">Full Name</label>
            <input id="fullname" name="fullname" type="text" required placeholder="e.g., Alex Johnson" />
          </div>

          <div class="full">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required placeholder="e.g., alex@example.com" />
          </div>

          <div>
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" placeholder="+49 160 0000000" />
          </div>

          <div>
            <label for="country">Country</label>
            <input id="country" name="country" type="text" placeholder="Germany" />
          </div>
        </div>

        <div class="actions">
          <button class="btn btn-primary" type="submit">Add Guest</button>
          <a class="btn btn-secondary" href="../maintenance.html">Cancel</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
